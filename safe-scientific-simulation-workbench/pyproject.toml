[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-core"
version = "1.0.0"
description = "S3W scientific core: contract-driven validation, deterministic damped-spring solver, feedback controller and benchmark."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
scientific_core = []

[tool.pytest.ini_options]
pythonpath = ["python", "tests/python"]
testpaths = ["tests/python"]
