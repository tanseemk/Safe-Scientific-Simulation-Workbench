name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: python -m pip install -r requirements-lock.txt
      - run: npm ci
      - name: Python + Node tests (offline, no network, no keys)
        run: npm test
      - name: Docs drift check
        run: npm run docs:check
      - name: Examples run
        run: npm run examples
      - name: Offline benchmark
        run: python -m scientific_core.benchmark --suite prompts/v1.json --mode both --seed 42 --out results/
        env: { PYTHONPATH: python }
      - name: Benchmark outputs exist
        run: node -e "for (const f of ['raw.jsonl','summary.csv','summary.json','report.md','protocol.json']) require('fs').accessSync('results/offline/'+f)"
